name: Sync BRC short links

on:
  push:
    branches:
      - master

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Publish from numbered BRC files. POST /sync/readme on brc.dev skips any
      # README row whose text contains both "BRC" and "Standard", which drops
      # BRC-87 ("Standardized ... BRC-22") and leaves /87 redirecting to
      # https://bsv.brc.devnull. The checkout is the commit that just landed,
      # so this does not wait for raw.githubusercontent.com.
      - name: Publish brc.dev short links
        env:
          BRC_AUTH_KEY: ${{ secrets.BRC_AUTH_KEY }}
        run: python3 scripts/brc_redirect_map.py publish
