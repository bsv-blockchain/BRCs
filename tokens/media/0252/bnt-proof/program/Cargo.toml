[package]
name = "bnt-step-program"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
bnt-step = { path = "../crates/bnt-step" }
sha2 = { version = "0.10", default-features = false }
sp1-zkvm = { version = "6.9", features = ["verify"] }

[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.2.0" }
